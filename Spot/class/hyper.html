<!-- Structure of a hyperlink -->
 <A HREF="destination_URL">Clickable text or image</A>

 <!-- Example 1: Link to ISBAT University website -->
  <A HREF="https://www.isbat.ac.ug">Visit ISBAT University</A>

  <!-- Example 2: Link opens in a new browser tab -->
   <A HREF="https://www.google.com" TARGET="blank">
    search on Google
   </A>
   <!-- Example 3: Image as a link(no visible border)-->
    <A HREF="https://www.isbat.ac.ug">
        <img src="images/image.png" border="0" alt="eagle"
    </A>
