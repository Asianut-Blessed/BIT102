<!-- Structure of a hyperlink -->
 <A HREF="destination_URL">Clickable text or image</A>

 <!-- Example 1: Link to ISBAT University website -->
  <A HREF="https://www.isbat.ac.ug">Visit ISBAT University</A>

  <!-- Example 2: Link opens in a new browser tab -->
   <A HREF="https://www.google.com" TARGET="blank">
    search on Google
   </A>
   <!-- Example 3: Image as a link(no visible border)-->
    <A HREF="https://www.isbat.ac.ug">
        <img src="IMG-20240522-WA0102.jpg" border="0" alt="eagle"
    </A>

 <IMG SRC="Spot/class/images WIDITH="400" HEIGHT="450" BORDER="5" USEMAP="#ugandaMap"
 ALT="Interactive map of Uganda">

  <MAP NAME="ugandaMap>"
     <!-- Northern Region - rectangle zone -->
    <AREA SHAPE="RECT" COORDS="80,10,280,140" HREF="northern.html" ALT=

 <AREA SHAPE="CIRCLE" COORDS="195,220,30"
 HREF="Kampala.html" ALT="Kampala - Capital City">
